name: Bug report
description: Something in Startup OS does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. Please use **made-up data** in everything below: no real names, emails, figures, tokens or addresses.

        **A security problem?** Do not open an issue. Report it privately from the repository's Security tab (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
      placeholder: On Finance, runway shows "Not known yet" although cash and burn both have values.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, from `pnpm dev:local` and `pnpm dev:signin <role>` if you can.
      placeholder: |
        1. pnpm dev:local, then pnpm dev:signin sales
        2. Open /sales
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - On my laptop (pnpm dev:local)
        - On my own deployment
        - Both
        - In the tests or the build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit of this repository you run (`git rev-parse --short HEAD`).
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Error messages (with any token or address taken out), the browser, a screenshot with made-up data.
